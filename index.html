<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Acessível e Responsivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-acessibilidade">
        <div class="container toolbar">
            <span class="toolbar-title">Acessibilidade:</span>
            <div class="btn-group">
                <button id="btn-contraste" aria-pressed="false" aria-label="Alternar alto contraste">
                    Alto Contraste ◐
                </button>
                <button id="btn-aumentar-texto" aria-label="Aumentar tamanho do texto">
                    A+
                </button>
                <button id="btn-diminuir-texto" aria-label="Diminuir tamanho do texto">
                    A-
                </button>
            </div>
        </div>
    </header>

    <main class="container" id="conteudo-principal">
        <section class="card">
            <h1>Acessibilidade e Responsividade na Web</h1>
            <p>
                Este layout utiliza unidades relativas para permitir que a alteração de tamanho de fonte funcione perfeitamente em todas as seções.
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
